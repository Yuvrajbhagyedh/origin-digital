<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
      <style>
        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }
    
        body {
          font-family: Arial, sans-serif;
        }
    
        nav {
          background-color: #fff;
          box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
          padding: 10px 20px;
          position: relative;
        }
    
        .nav-container {
          max-width: 1200px;
          margin: auto;
          display: flex;
          align-items: center;
          justify-content: space-between;
        }
    
        .logo img {
          width: 55px;
        }
    
        .nav-links {
          display: flex;
          gap: 20px;
          align-items: center;
        }
    
        .nav-links a {
          color: #000;
          text-decoration: none;
          font-size: 1rem;
          transition: color 0.2s;
        }
    
        .nav-links a:hover {
          color: #f39c12;
        }
    
        .search-box {
          display: block;
        }
    
        .search-box input {
          padding: 7px 12px;
          font-size: 1rem;
          border: 1px solid #ccc;
          border-radius: 5px;
        }
    
        .hamburger {
          display: none;
          flex-direction: column;
          gap: 5px;
          cursor: pointer;
        }
    
        .hamburger div {
          width: 25px;
          height: 3px;
          background-color: #000;
        }
    
        /* --- Responsive --- */
        @media (max-width: 768px) {
          .nav-container {
            flex-wrap: wrap;
            justify-content: space-between;
          }
    
          .nav-links {
            display: none;
            flex-direction: column;
            align-items: flex-start;
            width: 100%;
            background-color: #fff;
            padding: 15px 20px;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
          }
    
          .nav-links.active {
            display: flex;
          }
    
          .hamburger {
            display: flex;
          }
    
          .search-box {
            width: 100%;
            margin: 10px 0;
          }
    
          .search-box input {
            width: 100%;
          }
        }
      </style>
    </head>
    <body>
    
      <nav>
        <div class="nav-container">
          <div class="logo">
            <img src="logo.png" alt="Logo" />
          </div>
    
          <div class="hamburger" onclick="toggleMenu()">
            <div></div>
            <div></div>
            <div></div>
          </div>
    
          <div class="nav-links" id="navLinks">
            <div class="search-box">
              <input type="text" placeholder="Search..." />
            </div>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Projects</a>
            <a href="#">Contact</a>
          </div>
        </div>
      </nav>
    
      <script>
        function toggleMenu() {
          document.getElementById("navLinks").classList.toggle("active");
        }
      </script>
</body>
</html>
